<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>变位法典</title>
    <meta
      name="description"
      content="Carnet de conjugaison française — 手填的法语变位备忘录"
    />
    <!--
      The manifest link itself is injected by vite-plugin-pwa (vite.config.mts);
      these are the parts it does not inject, checked against the built
      dist/index.html rather than assumed.
    -->
    <meta name="theme-color" content="#EAE5DC" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="变位法典" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        /* The paper the Android app sits on. */
        background: #eae5dc;
      }

      /*
       * react-native-web's AppContainer is a View with `flex: 1`, so the mount
       * node itself has to be the flex container — with `display: block` the
       * whole app collapses to zero height and paints stacked at the top.
       */
      #root {
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
</html>
