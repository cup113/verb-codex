name: CI

on:
  push:
    # A branch push runs the checks and the build. A v* tag does the same and
    # then publishes the builds to a GitHub Release, whose assets do not
    # expire the way workflow artifacts do.
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: Lint, types and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

  web:
    name: Web bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run web:build

      # Assert what the browser's install criteria actually look at, rather
      # than that the build merely exited zero.
      - name: Verify the bundle is a complete PWA
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          test -f dist/icons/maskable-512.png
          grep -q 'rel="manifest"' dist/index.html
          grep -q '"purpose":"maskable"' dist/manifest.webmanifest
          # The fonts are part of the look: if they stopped being emitted, the
          # installed app would render in a fallback face and nobody would see
          # it until someone opened the installed app. Eight files: the six
          # local faces (the three Newsreader text faces, the two mono faces
          # and the symbol face) and the two merged CJK ones.
          #
          # The CJK pair is deliberately kept out of the precache manifest (at
          # ~3.4 MB each they dwarf the shell and blow workbox's per-file
          # limit) and fetched on demand instead, so this count is also the
          # check that "not precached" did not turn into "not built".
          test "$(ls dist/assets/*.ttf | wc -l)" -eq 8
          test "$(ls dist/assets/NewsreaderHan*.ttf | wc -l)" -eq 2
          # A long press on a row is a gesture, not a selection: WebKit ignores
          # the unprefixed `user-select`, so the prefixed pair is the whole
          # guard — and it has to survive the CSS minifier to exist at all.
          grep -q -- '-webkit-user-select:none' dist/assets/*.css
          grep -q -- '-webkit-touch-callout:none' dist/assets/*.css
          echo "web bundle: $(du -sh dist | cut -f1)"

      - uses: actions/upload-artifact@v6
        with:
          name: verbcodex-web
          if-no-files-found: error
          retention-days: 14
          path: dist

  android:
    name: Android release build
    runs-on: ubuntu-24.04
    needs: js
    env:
      # Declared at job level because the `secrets` context is not available
      # inside `if:` expressions, while `env` is.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      # React Native 0.87's own Gradle plugin asks for jvmToolchain(17), and
      # Gradle matches a toolchain request strictly: a newer JDK does not
      # satisfy it, so the build JDK here is 17 and not "17+".
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # v3's default `packages` still asked for the legacy `tools` package,
      # which no longer exists in Google's SDK index, so sdkmanager exited 1.
      # v4 defaults to platform-tools; naming it keeps that explicit.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install the NDK and CMake this project pins
        run: sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      # The wrapper points at a mirror because that is the fast one from the
      # development machine; CI takes the official distribution instead. The
      # pinned sha256 is the official one, so it verifies either way.
      - name: Point the wrapper at the official Gradle distribution
        run: |
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.4.1-bin.zip#' \
            android/gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl' android/gradle/wrapper/gradle-wrapper.properties

      # Optional: with no keystore secret the release build stays debug-signed,
      # which still produces an installable artifact. See README for the four
      # secrets that switch this to real signing.
      - name: Configure release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "VERBCODEX_STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "VERBCODEX_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "VERBCODEX_KEY_ALIAS=$KEY_ALIAS"
            echo "VERBCODEX_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      # A debug APK carries no JS bundle because Metro serves it at runtime; a
      # release APK must carry one. This is the check that tells the two apart.
      - name: Verify the APK is self-contained
        run: |
          set -euo pipefail
          apk=$(ls android/app/build/outputs/apk/release/*.apk)
          unzip -l "$apk" | grep -q 'assets/index.android.bundle'
          echo "$apk carries assets/index.android.bundle"

      - uses: actions/upload-artifact@v6
        with:
          name: verbcodex-release
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

  release:
    name: Publish to a Release
    # Only for a version tag, and only once the build of that same commit is
    # green — `android` already depends on `js`, so this covers everything.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-24.04
    # Release assets are the only thing that needs write access, so the token
    # stays read-only everywhere else.
    #
    # `actions: read` is not optional: listing or downloading a run's artifacts
    # goes through the actions API, and the moment any scope is named here every
    # unnamed one becomes `none` — which is what turned `gh run download` into
    # "HTTP 403: Resource not accessible by integration".
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Fetch the builds this run produced
        run: |
          set -euo pipefail
          # Downloads the artifact's own layout: apk/release, bundle/release.
          gh run download "$GITHUB_RUN_ID" --name verbcodex-release --dir builds
          find builds -type f -printf '%p %s bytes\n'

      - name: Name the assets after the tag
        run: |
          set -euo pipefail
          mv builds/apk/release/app-release.apk "verbcodex-${GITHUB_REF_NAME}.apk"
          mv builds/bundle/release/app-release.aab "verbcodex-${GITHUB_REF_NAME}.aab"
          ls -l verbcodex-*

      - name: Create or update the release
        run: |
          set -euo pipefail
          # Re-running an existing tag must not fail the build.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" verbcodex-* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              verbcodex-*
          fi
